# HSTS conditionne au schema : inerte tant que la pile parle HTTP, correct le jour du
# TLS. Le poser en clair n'aurait aucun effet et piegerait le premier navigateur qui
# atteindrait l'instance en HTTPS. Le TLS lui-meme reste hors perimetre de F11.2.
map $scheme $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Les en-tetes de securite. « always » les emet aussi sur les reponses d'erreur, ou une
    # page 404 servie sans CSP resterait un vecteur.
    #
    # Ce bloc-ci ne protege PAS le corps du dashboard : / et toute route cote client
    # atteignent le navigateur via la redirection interne de try_files vers /index.html,
    # qui pose ses propres add_header et annule donc ceux-la. Ce qui reste couvert ici,
    # c'est les pages d'erreur, /actuator/health, et tout fichier statique qui echapperait
    # a la regex des ressources hachees. La protection reelle du dashboard vient de la
    # repetition dans les blocs `= /index.html` et ressources hachees, plus bas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security $hsts always;
    # style-src garde 'unsafe-inline' : Angular injecte les styles de composants dans des
    # balises <style> a l'execution, et la CSP les refuserait sinon — le dashboard
    # s'afficherait nu. Le retirer demande ngCspNonce et un nonce genere par requete, un
    # chantier a part. script-src, lui, reste strict : le build n'emet que des chunks
    # externes, et c'est la directive qui compte le plus.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Le flux temps reel. Ce bloc est un « location = », donc il l'emporte sur le prefixe
    # /api/ quelle que soit sa position dans le fichier. Sans proxy_buffering off, nginx
    # accumule le flux SSE et le dashboard se fige : le battement part toutes les 20 s et
    # l'emetteur expire a 30 min, deux valeurs portees par application.yml.
    location = /api/stream/leads {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # Pour un eventuel proxy place devant celui-ci : lui dire de ne pas tamponner non
        # plus. Sans effet sur nginx lui-meme, qui obeit a proxy_buffering ci-dessus.
        add_header X-Accel-Buffering no always;
        # Repetees, et non oubliees : un add_header dans un location annule TOUS ceux du
        # bloc server. Sans cette repetition, le flux SSE — text/event-stream — n'aurait
        # aucune CSP, et X-Content-Type-Options est celui qui compte le plus ici.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # L'API, webhooks compris. C'est ce bloc qui fait disparaitre CORS : le navigateur ne
    # voit qu'une seule origine.
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # La sante, pour les sondes exterieures. Le reste d'actuator n'est pas expose.
    location = /actuator/health {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html porte les noms hashes des chunks : le mettre en cache figerait
    # l'application sur une version disparue au deploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repetees, et non oubliees : un add_header dans un location annule TOUS ceux du
        # bloc server. Sans cette repetition, index.html — la page la plus servie — n'aurait
        # aucune CSP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Les chunks portent un hash dans leur nom : leur contenu ne change jamais.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        # Un seul add_header, et pas « expires 1y » en plus : les deux directives posent
        # chacune un Cache-Control, et le client en recoit alors deux. La concatenation
        # reste valide, mais une seule ligne se lit et s'audite mieux.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repetees, et non oubliees : un add_header dans un location annule TOUS ceux du
        # bloc server. Sans cette repetition, index.html — la page la plus servie — n'aurait
        # aucune CSP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Routage cote client : /leads/42 n'existe pas sur le disque, il faut rendre l'index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
