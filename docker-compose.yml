# Dependances locales du backend. `docker compose up -d` demarre Postgres + RabbitMQ ;
# `docker compose --profile dolibarr up -d` ajoute une instance Dolibarr de test.
services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: leadflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: leadflow
      RABBITMQ_DEFAULT_PASS: leadflow
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # console de gestion : http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  dolibarr-db:
    image: mariadb:11
    container_name: leadflow-dolibarr-db
    profiles: ["dolibarr"]
    environment:
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: dolibarr
      MARIADB_ROOT_PASSWORD: dolibarr
    volumes:
      - dolibarr-db-data:/var/lib/mysql

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: leadflow-dolibarr
    profiles: ["dolibarr"]
    depends_on:
      - dolibarr-db
    environment:
      DOLI_DB_HOST: dolibarr-db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
      DOLI_URL_ROOT: http://localhost:8081
    ports:
      - "8081:80"
    volumes:
      - dolibarr-docs:/var/www/documents

volumes:
  postgres-data:
  rabbitmq-data:
  dolibarr-db-data:
  dolibarr-docs:
