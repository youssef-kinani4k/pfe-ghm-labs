# Dependances locales du backend. `docker compose up -d` demarre Postgres + RabbitMQ.
# Les ERP de test sont derriere des profils, pour ne monter que celui dont on a besoin :
#   docker compose --profile dolibarr up -d
#   docker compose --profile odoo up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: leadflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: leadflow
      RABBITMQ_DEFAULT_PASS: leadflow
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # console de gestion : http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  dolibarr-db:
    image: mariadb:11
    container_name: leadflow-dolibarr-db
    profiles: ["dolibarr"]
    environment:
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: dolibarr
      MARIADB_ROOT_PASSWORD: dolibarr
    volumes:
      - dolibarr-db-data:/var/lib/mysql

  dolibarr:
    # Version epinglee : F5 teste la conformite d'une API, un tag flottant rendrait les
    # tests d'integration non reproductibles. Version relevee par la sonde de la tache 1.
    image: dolibarr/dolibarr:23.0.2
    container_name: leadflow-dolibarr
    profiles: ["dolibarr"]
    depends_on:
      - dolibarr-db
    environment:
      DOLI_DB_HOST: dolibarr-db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
      DOLI_URL_ROOT: http://localhost:8081
    ports:
      - "8081:80"
    volumes:
      - dolibarr-docs:/var/www/documents

  odoo-db:
    image: postgres:16-alpine
    container_name: leadflow-odoo-db
    profiles: ["odoo"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    # Version epinglee, meme raison que Dolibarr (17.0-20260817 releve par la sonde).
    image: odoo:17.0
    container_name: leadflow-odoo
    profiles: ["odoo"]
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  postgres-data:
  rabbitmq-data:
  dolibarr-db-data:
  dolibarr-docs:
  odoo-db-data:
  odoo-data:
