spring:
  application:
    name: leadflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadflow}
    username: ${DB_USER:leadflow}
    password: ${DB_PASSWORD:leadflow}

  jpa:
    hibernate:
      # Le schema est la propriete de Flyway : Hibernate ne fait que le valider.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:leadflow}
    password: ${RABBITMQ_PASSWORD:leadflow}
    listener:
      simple:
        # Un lead qui echoue est rejete vers la DLQ plutot que reboucle a l'infini.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

leadflow:
  security:
    # Cle AES-256 en base64 sur 32 octets. Aucune valeur de repli : l'application
    # doit refuser de demarrer plutot que de chiffrer avec une cle devinable.
    master-key: ${LEADFLOW_MASTER_KEY:}
  webhook:
    signature-header: X-Leadflow-Signature
    # Fenetre de tolerance anti-rejeu sur l'horodatage de la requete, dans les deux sens.
    tolerance: 5m
    # Applique apres lecture du corps : protege la base et la file, pas la memoire du
    # serveur. Un vrai garde-fou memoire releve du reverse-proxy (F7).
    max-payload-bytes: 65536
    # Filet de republication : age minimal d'une ligne non publiee, et periode de balayage.
    relay-after: 2m
    relay-interval: 30s
  crm:
    # Reglages techniques uniquement. L'URL et les identifiants de chaque instance ERP
    # vivent sur la ligne client, chiffres.
    providers:
      dolibarr:
        enabled: true
        connect-timeout: 5s
        read-timeout: 15s
      odoo:
        # Adaptateur ecrit en F5 : le connecteur est desormais utilisable.
        enabled: true
        connect-timeout: 5s
        read-timeout: 15s
