server:
  # 8090 et non 8080 : le port par defaut de Tomcat est occupe en permanence sur le poste
  # de developpement du projet, et un port choisi vaut mieux qu'un demarrage qui echoue une
  # fois sur deux. Surchargeable par SERVER_PORT pour tout autre environnement.
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: leadflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadflow}
    username: ${DB_USER:leadflow}
    password: ${DB_PASSWORD:leadflow}

  jpa:
    hibernate:
      # Le schema est la propriete de Flyway : Hibernate ne fait que le valider.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:leadflow}
    password: ${RABBITMQ_PASSWORD:leadflow}
    # La publication du webhook part sur le thread de la requete, apres le commit : sans
    # delai borne, un broker qui accepte la connexion sans repondre bloquerait les threads
    # Tomcat alors meme que le filet de republication existe pour couvrir ce cas.
    connection-timeout: 5s
    listener:
      simple:
        # Un lead qui echoue est rejete vers la DLQ plutot que reboucle a l'infini.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

leadflow:
  security:
    # Cle AES-256 en base64 sur 32 octets. Aucune valeur de repli : l'application
    # doit refuser de demarrer plutot que de chiffrer avec une cle devinable.
    master-key: ${LEADFLOW_MASTER_KEY:}
    cors:
      # Vide par defaut, et c'est le cas de production : Nginx sert le dashboard et relaie
      # l'API sous une origine unique, donc il n'y a aucune requete cross-origin. Seul le
      # profil dev la peuple, ou ng serve tient le :4200 face au backend sur :8090.
      allowed-origins: []
    crm:
      # Le serveur appelle l'URL d'ERP que l'operateur lui donne. Sans cette politique,
      # POST /api/admin/crm/test sonde pour lui n'importe quelle adresse de son reseau,
      # metadonnees d'instance cloud comprises.
      actif: true
      # Correspondance EXACTE, ni prefixe ni suffixe : « dolibarr » n'autorise pas
      # « dolibarr.attaquant.test ». Vide ici ; les profils la peuplent.
      hotes-autorises: []
  dashboard:
    # Cle de signature du jeton de session. Aucune valeur de repli, comme la cle maitre :
    # l'application doit refuser de demarrer plutot que de signer avec un secret devinable.
    jwt-secret: ${LEADFLOW_JWT_SECRET:}
    # Huit heures, sans rafraichissement : a l'expiration, retour a l'ecran de connexion.
    token-ttl: 8h
    users:
      - username: ${LEADFLOW_ADMIN_USER:admin}
        # Hash BCrypt, jamais le mot de passe, meme ici. Genere par exemple avec
        # htpasswd -bnBC 10 "" 'mot-de-passe' | tr -d ':\n'
        password-hash: ${LEADFLOW_ADMIN_PASSWORD_HASH:}
  webhook:
    signature-header: X-Leadflow-Signature
    # Fenetre de tolerance anti-rejeu sur l'horodatage de la requete, dans les deux sens.
    tolerance: 5m
    # Applique apres lecture du corps : protege la base et la file, pas la memoire du
    # serveur. Un vrai garde-fou memoire releve du reverse-proxy (F7).
    max-payload-bytes: 65536
    # Plafond de volume, par cle publique. La signature protege l'authenticite d'une
    # soumission, pas leur nombre. Le compteur ne consulte jamais la base : il cle sur le
    # segment brut de l'URL, sans quoi le 429 dirait quelles cles publiques existent.
    rate-limit:
      actif: true
      requetes-par-minute: 60
      rafale: 120
      # Une cle inconnue consomme une entree : sans plafond, marteler des cles aleatoires
      # ferait enfler la memoire — soit l'attaque que ce filtre existe pour arreter.
      cles-suivies-max: 10000
      fenetre-inactivite: 10m
    # Filet de republication : age minimal d'une ligne non publiee, et periode de balayage.
    relay-after: 2m
    relay-interval: 30s
  qualification:
    # Fenetre de deduplication : meme client, meme email normalise.
    dedup-window: 24h
    listener:
      # Presence du consommateur de la file. Toujours vrai en production ; la suite de
      # tests le retire pour lire elle-meme ce que la capture a publie.
      enabled: true
  routing:
    listener:
      # Presence du consommateur de leadflow.leads.qualified. Toujours vrai en production ;
      # la suite de tests le retire pour lire elle-meme ce que la qualification a publie.
      enabled: true
  monitoring:
    deadletter:
      listener:
        # Presence du consommateur de la DLQ. Toujours vrai en production ; la suite de
        # tests le retire, sauf la ou elle l'eprouve.
        enabled: true
    stream:
      listener:
        enabled: true
      emitter-timeout: 30m
      heartbeat-interval: 20s
    relay:
      qualified-after: 2m
      routed-after: 2m
      interval: 30s
  intent:
    gemini:
      enabled: true
      # Cle globale a l'instance : l'analyse d'intention est un service de l'agence, pas un
      # reglage de tenant. Depuis F7.2 ce n'est plus qu'un REPLI : la cle enregistree depuis
      # l'ecran « Parametres » (table intent_setting) l'emporte sur cette variable. Sans
      # l'une ni l'autre, l'application demarre et qualifie en mode RULES.
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/models/
      # gemini-2.5-flash n'est plus servi aux nouvelles cles : Google renvoie 404 en
      # invitant a passer au modele ci-dessous. C'est une propriete et non une constante
      # precisement pour qu'un retrait de modele se repare par la configuration.
      model: gemini-3.6-flash
      connect-timeout: 3s
      read-timeout: 8s
      # Garde-fou sur le texte envoye au modele.
      max-message-chars: 2000
  crm:
    listener:
      # Presence du consommateur de leadflow.leads.routed. Toujours vrai en production ;
      # la suite de tests le retire pour ne pas appeler d'ERP sans le vouloir.
      enabled: true
    # Reglages techniques uniquement. L'URL et les identifiants de chaque instance ERP
    # vivent sur la ligne client, chiffres.
    providers:
      dolibarr:
        enabled: true
        connect-timeout: 5s
        read-timeout: 15s
      odoo:
        # Adaptateur ecrit en F5 : le connecteur est desormais utilisable.
        enabled: true
        connect-timeout: 5s
        read-timeout: 15s
