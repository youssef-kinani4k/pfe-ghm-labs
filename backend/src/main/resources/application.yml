spring:
  application:
    name: leadflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadflow}
    username: ${DB_USER:leadflow}
    password: ${DB_PASSWORD:leadflow}

  jpa:
    hibernate:
      # Le schema est la propriete de Flyway : Hibernate ne fait que le valider.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:leadflow}
    password: ${RABBITMQ_PASSWORD:leadflow}
    listener:
      simple:
        # Un lead qui echoue est rejete vers la DLQ plutot que reboucle a l'infini.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

leadflow:
  webhook:
    # Secret partage avec les sites clients pour signer le payload (HMAC-SHA256).
    hmac-secret: ${WEBHOOK_HMAC_SECRET:change-me-in-env}
    signature-header: X-Leadflow-Signature
    # Fenetre de tolerance anti-rejeu sur l'horodatage de la requete.
    tolerance: 5m
  crm:
    # Fournisseur utilise quand le lead ne designe pas explicitement sa cible.
    default-provider: ${CRM_DEFAULT_PROVIDER:dolibarr}
    providers:
      dolibarr:
        enabled: true
        base-url: ${DOLIBARR_BASE_URL:http://localhost:8081/api/index.php}
        api-key: ${DOLIBARR_API_KEY:}
        connect-timeout: 5s
        read-timeout: 15s
      odoo:
        enabled: false
        base-url: ${ODOO_BASE_URL:http://localhost:8069}
        database: ${ODOO_DATABASE:leadflow}
        username: ${ODOO_USERNAME:}
        api-key: ${ODOO_API_KEY:}
        connect-timeout: 5s
        read-timeout: 15s
