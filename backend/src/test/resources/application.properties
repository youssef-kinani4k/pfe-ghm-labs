# Cle maitre fixe pour la suite de tests. Ce fichier s'ajoute a application.yml du
# classpath principal sans le remplacer : les proprietes y ont simplement priorite.
leadflow.security.master-key=gh/SD1Jp/HfWc/sB/BybtvbUqehzXmv0YIZ8uMwutME=

# Le consommateur de qualification n'existe pas dans la suite : les tests de la couche
# capture lisent eux-memes la file pour verifier ce qui y a ete publie, et un consommateur
# actif leur volerait le message. C'est le bean qui est retire, et non son demarrage qui est
# desactive : un contexte remis en marche par le cache de tests redemarre ses beans
# Lifecycle en ignorant auto-startup. Un test qui veut le consommateur le rallume par
# @TestPropertySource.
leadflow.qualification.listener.enabled=false

# Meme raison que pour la qualification : un consommateur actif volerait aux tests des
# etapes amont les messages qu'ils viennent de publier. C'est le bean qui est retire, et
# non son demarrage qui est desactive.
leadflow.routing.listener.enabled=false
leadflow.crm.listener.enabled=false

# Secret de signature fixe pour la suite de tests, comme la cle maitre au-dessus. Les tests
# qui eprouvent l'authentification declarent en plus leurs propres comptes.
leadflow.dashboard.jwt-secret=cle-de-signature-de-test-suffisamment-longue-32o
